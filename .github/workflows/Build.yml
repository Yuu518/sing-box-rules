name: Build rules files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          echo "RELEASE_NAME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
        shell: bash

      - name: Checkout master branch
        uses: actions/checkout@v6.0.1

      - name: Checkout src branch
        uses: actions/checkout@v6.0.1
        with:
          ref: src
          path: src

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v6.0.1
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Checkout Yuu518/geoip
        uses: actions/checkout@v6.0.1
        with:
          repository: Yuu518/geoip
          path: geoip
          ref: release

      - name: Setup Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: ./go.sum

      - name: Build and generate rules
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          go build -o sing-box-rules .
          ./sing-box-rules convert -c ./config.json

      - name: Git push assets to "release" branch
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "Released on ${RELEASE_NAME}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Git push assets to "rule_set" branch
        run: |
          cd rule_set || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b rule_set
          git add .
          git commit -m "Released on ${RELEASE_NAME}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin rule_set

      - name: Git push assets to "rule-set" branch of Yuu518/Yuu-rules
        run: |
          cd rule-set || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b rule-set
          git add .
          git commit -m "Released on ${RELEASE_NAME}"
          git remote add origin "https://x-access-token:${{ secrets.RULES_REPO_TOKEN }}@github.com/Yuu518/Yuu-rules"
          git push -f -u origin rule-set

      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2.0.6
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: true
    steps:
      - name: Checkout web branch
        uses: actions/checkout@v6.0.1
        with:
          ref: web

      - name: Checkout rule_set branch
        uses: actions/checkout@v6.0.1
        with:
          ref: rule_set
          path: rule_set

      - name: Checkout release branch
        uses: actions/checkout@v6.0.1
        with:
          ref: release
          path: release

      - name: Setup Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: stable
          check-latest: true

      - name: Build static web panel and lookup index
        run: go run . -rule-set ./rule_set -release ./release -web ./web -out ./dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CF_PAGES_PROJECT || vars.CF_PAGES_PROJECT || 'sing-box-rules' }} --branch=main --commit-dirty=true
