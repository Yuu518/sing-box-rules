name: Deploy Web Panel to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - web

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web branch
        uses: actions/checkout@v6.0.1

      - name: Checkout rule_set branch
        uses: actions/checkout@v6.0.1
        with:
          ref: rule_set
          path: rule_set

      - name: Checkout release branch
        uses: actions/checkout@v6.0.1
        with:
          ref: release
          path: release

      - name: Setup Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: stable
          check-latest: true

      - name: Build static web panel and lookup index
        run: go run . -rule-set ./rule_set -release ./release -web ./web -out ./dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
